services:
  drawio-mcp:
    build:
      context: .
      dockerfile: mcp-app-server/Dockerfile
    image: drawio-mcp-app:local
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3001}
      LISTEN: 0.0.0.0
      DOMAIN: ${DOMAIN:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
